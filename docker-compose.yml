services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Local container stack. Set APP_ENV=production and SESSION_COOKIE_SECURE=true behind HTTPS.
      APP_ENV: development
      SECRET_KEY: change-this-to-a-long-random-production-secret
      SESSION_COOKIE_SECURE: "false"
      DATABASE_URL: postgresql+psycopg://supportsphere:supportsphere@db:5432/supportsphere
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: supportsphere
      POSTGRES_USER: supportsphere
      POSTGRES_PASSWORD: supportsphere
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportsphere -d supportsphere"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  uploads_data:
