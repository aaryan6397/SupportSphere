{% extends "base.html" %}
{% block title %}{{ 'Edit' if article else 'New' }} Article | SupportSphere{% endblock %}
{% block content %}
<section class="ticket-form-page"><div class="form-page-heading"><p class="eyebrow">ADMIN KNOWLEDGE BASE</p><h1>{{ 'Edit' if article else 'Create' }} <em>article.</em></h1><p>Publish accurate self-service answers for customers and agents.</p></div><form method="POST" class="ticket-form-card"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="title">Title</label><input id="title" name="title" maxlength="200" value="{{ article.title if article else '' }}" required><label for="category">Category</label><select id="category" name="category" required>{% for category in categories %}<option value="{{ category }}" {% if article and article.category == category %}selected{% endif %}>{{ category }}</option>{% endfor %}</select><label for="summary">Short summary</label><textarea id="summary" name="summary" maxlength="400" rows="3" required>{{ article.summary if article else '' }}</textarea><label for="body">Article content</label><textarea id="body" name="body" maxlength="20000" rows="12" required>{{ article.body if article else '' }}</textarea><label class="remember-label"><input type="checkbox" name="is_published" {% if article and article.is_published %}checked{% endif %}> Publish immediately</label><button type="submit" class="primary-button form-button">Save article <span>→</span></button></form></section>
{% endblock %}
