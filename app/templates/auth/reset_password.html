{% extends "base.html" %}
{% block title %}Choose New Password | SupportSphere{% endblock %}
{% block content %}
<section class="auth-page"><div class="auth-intro"><p class="eyebrow">ACCOUNT RECOVERY</p><h1>Choose a<br><em>new password.</em></h1><p>Use at least 8 characters including uppercase, lowercase, and a number.</p></div><div class="auth-card"><p class="eyebrow">NEW PASSWORD</p><h2>Secure your account</h2><form method="POST" class="auth-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="password">New password</label><div class="password-field"><input id="password" name="password" type="password" minlength="8" required><button type="button" class="password-toggle" data-password-toggle="password" aria-label="Show password" aria-pressed="false">Show</button></div><label for="confirm_password">Confirm new password</label><div class="password-field"><input id="confirm_password" name="confirm_password" type="password" minlength="8" required><button type="button" class="password-toggle" data-password-toggle="confirm_password" aria-label="Show password" aria-pressed="false">Show</button></div><button type="submit" class="primary-button form-button">Update password <span>→</span></button></form></div></section>
{% endblock %}
