{% extends "base.html" %}
{% block title %}Reset Password | SupportSphere{% endblock %}
{% block content %}
<section class="auth-page"><div class="auth-intro"><p class="eyebrow">ACCOUNT RECOVERY</p><h1>Reset your<br><em>password.</em></h1><p>Enter your account email. If it exists, we will send a secure reset link.</p></div><div class="auth-card"><p class="eyebrow">PASSWORD RESET</p><h2>Recover access</h2><form method="POST" class="auth-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="email">Email address</label><input id="email" name="email" type="email" placeholder="you@example.com" required><button type="submit" class="primary-button form-button">Send reset link <span>→</span></button></form><p class="auth-switch"><a href="{{ url_for('auth.login') }}">Back to login</a></p></div></section>
{% endblock %}
